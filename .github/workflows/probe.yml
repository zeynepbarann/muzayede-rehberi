# Temporary: prints the structure of pages so a scraper can be written. Run by hand only.
name: Sayfa yapısını incele
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Boşlukla ayrılmış adresler"
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          URLS: ${{ inputs.urls }}
        run: python3 tools/probe.py $URLS
